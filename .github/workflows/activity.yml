name: Update README with Recent Activity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update README
    steps:
      - uses: actions/checkout@v3
      - uses: Readme-Workflows/recent-activity@v2.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
