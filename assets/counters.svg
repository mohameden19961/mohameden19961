<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6E40C9"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6E40C9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="160" fill="url(#bg)" rx="20"/>

  <!-- Counter 1 -->
  <g transform="translate(0, 0)">
    <rect x="20" y="20" width="180" height="120" rx="15" fill="#1e1b4b" stroke="#6E40C9" stroke-width="1" opacity="0.8" filter="url(#shadow)"/>
    <text x="110" y="60" font-family="monospace" font-size="32" fill="url(#g1)" text-anchor="middle" font-weight="bold">
      1,802
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    </text>
    <text x="110" y="85" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Total Contributions</text>
    <circle cx="110" cy="105" r="3" fill="#6E40C9"><animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/></circle>
    <line x1="80" y1="105" x2="140" y2="105" stroke="#6E40C9" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Counter 2 -->
  <g transform="translate(200, 0)">
    <rect x="20" y="20" width="180" height="120" rx="15" fill="#1e1b4b" stroke="#22d3ee" stroke-width="1" opacity="0.8" filter="url(#shadow)"/>
    <text x="110" y="60" font-family="monospace" font-size="32" fill="url(#g2)" text-anchor="middle" font-weight="bold">
      1,500
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="110" y="85" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Mega Project Commits</text>
    <circle cx="110" cy="105" r="3" fill="#22d3ee"><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <line x1="80" y1="105" x2="140" y2="105" stroke="#22d3ee" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Counter 3 -->
  <g transform="translate(400, 0)">
    <rect x="20" y="20" width="180" height="120" rx="15" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1" opacity="0.8" filter="url(#shadow)"/>
    <text x="110" y="60" font-family="monospace" font-size="32" fill="url(#g3)" text-anchor="middle" font-weight="bold">
      66
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="110" y="85" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Public Repositories</text>
    <circle cx="110" cy="105" r="3" fill="#f59e0b"><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1s" repeatCount="indefinite"/></circle>
    <line x1="80" y1="105" x2="140" y2="105" stroke="#f59e0b" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Counter 4 -->
  <g transform="translate(600, 0)">
    <rect x="20" y="20" width="180" height="120" rx="15" fill="#1e1b4b" stroke="#10b981" stroke-width="1" opacity="0.8" filter="url(#shadow)"/>
    <text x="110" y="60" font-family="monospace" font-size="32" fill="url(#g4)" text-anchor="middle" font-weight="bold">
      12
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.9s" fill="freeze"/>
    </text>
    <text x="110" y="85" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Merged Pull Requests</text>
    <circle cx="110" cy="105" r="3" fill="#10b981"><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <line x1="80" y1="105" x2="140" y2="105" stroke="#10b981" stroke-width="0.5" opacity="0.3"/>
  </g>
</svg>
