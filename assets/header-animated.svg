<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6E40C9"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6E40C9"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
      <animate attributeName="x1" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6E40C9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)" rx="20"/>

  <!-- Animated grid dots -->
  <g opacity="0.15">
    <circle cx="50" cy="50" r="1.5" fill="#6E40C9"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="30" r="1.5" fill="#a855f7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="60" r="1.5" fill="#6E40C9"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="40" r="1.5" fill="#a855f7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="55" r="1.5" fill="#6E40C9"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="35" r="1.5" fill="#a855f7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="120" r="1.5" fill="#22d3ee"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="100" r="1.5" fill="#3b82f6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="110" r="1.5" fill="#22d3ee"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="90" r="1.5" fill="#3b82f6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="130" r="1.5" fill="#22d3ee"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Animated orbiting rings -->
  <circle cx="790" cy="110" r="50" fill="none" stroke="#6E40C9" stroke-width="1" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" from="0 790 110" to="360 790 110" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="110" r="35" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.15">
    <animateTransform attributeName="transform" type="rotate" from="360 790 110" to="0 790 110" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="110" r="20" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.1">
    <animateTransform attributeName="transform" type="rotate" from="0 790 110" to="360 790 110" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Code brackets -->
  <text x="50" y="85" font-family="monospace" font-size="50" fill="url(#grad1)" font-weight="bold" filter="url(#glow)">&lt;</text>
  <text x="530" y="85" font-family="monospace" font-size="50" fill="url(#grad1)" font-weight="bold" filter="url(#glow)">/&gt;</text>

  <!-- Main title -->
  <text x="105" y="85" font-family="monospace" font-size="36" fill="#e2e8f0" font-weight="bold" filter="url(#shadow)">
    <tspan>Hi, I'm </tspan>
    <tspan fill="url(#grad1)">Abdy</tspan>
  </text>

  <!-- Subtitle typing effect -->
  <text x="105" y="125" font-family="monospace" font-size="18" fill="#94a3b8">
    <tspan>Full-Stack Developer &amp; CS Student @ SUPNUM</tspan>
    <tspan fill="#6E40C9" opacity="0">|</tspan>
  </text>

  <!-- Animated cursor -->
  <text x="560" y="125" font-family="monospace" font-size="18" fill="#6E40C9">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    ▎
  </text>

  <!-- Stats line -->
  <g transform="translate(105, 160)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#1e1b4b" stroke="#6E40C9" stroke-width="1" opacity="0.8"/>
    <circle cx="18" cy="14" r="5" fill="#22d3ee"><animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/></circle>
    <text x="30" y="19" font-family="monospace" font-size="12" fill="#e2e8f0">1,802 Contributions</text>
  </g>

  <g transform="translate(260, 160)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
    <circle cx="18" cy="14" r="5" fill="#a855f7"><animate attributeName="r" values="5;7;5" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text x="30" y="19" font-family="monospace" font-size="12" fill="#e2e8f0">66 Repos</text>
  </g>

  <g transform="translate(395, 160)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#1e1b4b" stroke="#22d3ee" stroke-width="1" opacity="0.8"/>
    <circle cx="18" cy="14" r="5" fill="#22d3ee"><animate attributeName="r" values="5;7;5" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="30" y="19" font-family="monospace" font-size="12" fill="#e2e8f0">1,500-commit project</text>
  </g>
</svg>
